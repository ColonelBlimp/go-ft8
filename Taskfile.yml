# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
dotenv: ['.env']

includes:
  version: ./Taskfile.version.yml

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  test:
    desc: Run the full Go test suite with the default backend (PocketFFT when CGO is available).
    cmds:
      - go test ./...

  test:smoke:
    desc: Run fixture-independent smoke tests.
    cmds:
      - go test ./... -run 'TestCRC14FastMatchesSlow|TestPackEncodeRoundTripsStandardMessages|TestEncodeStandardMessage|TestDecodeMessagesWithReportEmptyInputDiagnostics|TestDecodeMessagesCheckedRejectsInvalidInput|TestDecodeStructuredCheckedRejectsInvalidInput|TestDecodeOptions'

  test:gonum:
    desc: Run the full test suite with the pure-Go Gonum FFT backend (CGO disabled).
    cmds:
      - CGO_ENABLED=0 go test ./...

  test:smoke-gonum:
    desc: Run smoke tests with the pure-Go Gonum FFT backend (CGO disabled).
    cmds:
      - CGO_ENABLED=0 go test ./... -run 'TestCRC14FastMatchesSlow|TestPackEncodeRoundTripsStandardMessages|TestEncodeStandardMessage|TestDecodeMessagesWithReportEmptyInputDiagnostics|TestDecodeMessagesCheckedRejectsInvalidInput|TestDecodeStructuredCheckedRejectsInvalidInput|TestDecodeOptions'

  test:race:
    desc: Run race detector smoke tests for the FT8 package.
    cmds:
      - go test -race ./ft8 -run 'TestStatelessDecodeConcurrentNoRace|TestDecodeMessagesCheckedRejectsInvalidInput|TestDecodeStructuredCheckedRejectsInvalidInput|FuzzDecodePublicAPIsNoPanic'

  test:race-gonum:
    desc: Run FT8 race detector smoke tests with the pure-Go Gonum FFT backend.
    cmds:
      # -race itself requires CGO, so the Gonum backend is selected via the
      # gonumfft tag here instead of CGO_ENABLED=0.
      - go test -race -tags gonumfft ./ft8 -run 'TestStatelessDecodeConcurrentNoRace|TestDecodeMessagesCheckedRejectsInvalidInput|TestDecodeStructuredCheckedRejectsInvalidInput|FuzzDecodePublicAPIsNoPanic'

  test:oracle-ft4:
    desc: Validate FT4 encoder output with a pinned WSJT-X jt9 binary.
    requires:
      vars: [WSJTX_JT9]
    cmds:
      - go test ./ft4 -run '^TestEncodeStandardMessageJT9Oracle$' -v

  bench:strict:
    desc: Benchmark strict decoding with the default backend.
    cmds:
      - go test ./ft8 -run=^$ -bench='BenchmarkDecodeMessagesPerFixture$' -benchmem -benchtime=1x -count=1

  bench:strict-gonum:
    desc: Benchmark strict decoding with the pure-Go Gonum FFT backend.
    cmds:
      - go test -tags gonumfft ./ft8 -run=^$ -bench='BenchmarkDecodeMessagesPerFixture$' -benchmem -benchtime=1x -count=1

  bench:deep:
    desc: Benchmark deep decoding with the default backend.
    cmds:
      - go test ./ft8 -run=^$ -bench='BenchmarkDecodeMessagesDeepPerFixture$' -benchmem -benchtime=1x -count=1

  bench:deep-gonum:
    desc: Benchmark deep decoding with the pure-Go Gonum FFT backend.
    cmds:
      - go test -tags gonumfft ./ft8 -run=^$ -bench='BenchmarkDecodeMessagesDeepPerFixture$' -benchmem -benchtime=1x -count=1

  bench:structured-deep:
    desc: Benchmark structured strict+deep decoding with the default backend.
    cmds:
      - go test ./ft8 -run=^$ -bench='BenchmarkDecodeStructuredDeepPerFixture$' -benchmem -benchtime=1x -count=1

  bench:payload:
    desc: Benchmark verified-payload parsing and candidate extraction.
    cmds:
      - go test ./ft8 -run=^$ -bench='BenchmarkParse(Payload77GoldenVectors|CandidatePayload)$' -benchmem -benchtime=200ms -count=5

  bench:
    desc: Run strict and deep decode benchmarks with the default backend.
    deps:
      - bench:strict
      - bench:deep
